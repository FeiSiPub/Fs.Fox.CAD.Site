name: Validate site source integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout site repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.11.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source lock and tests
        run: npm run check

      - name: Verify locked source on GitHub
        run: npm run source:verify
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build bootstrap site from locked source
        run: npm run build
